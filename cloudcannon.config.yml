# --- Global Paths ---
paths:
  uploads: images/
  static: /

# --- Data Configuration (The Translation Engine) ---
data_config:
  translations:
    path: data/translations.json
    format: json

# --- Collections (Lina's Sidebar) ---
collections_config:
  pages:
    name: Pages
    path: /
    filter:
      - index.html
      - about/index.html
      - contact/index.html
      - thankyou/index.html
    icon: description
  data:
    name: Site Content
    path: data
    icon: language

# --- Inputs & Interface (The Edit Boxes) ---
_inputs:
  hero_title:
    label: "Home: Main Title"
  hero_subtitle:
    label: "Home: Sub-headline"
  about_heading:
    label: "About: Headline"
  about_bio:
    type: html # Enables Bold/Italic toolbar
    label: "About: Full Biography"
  sign_off:
    label: "About: Signature Sign-off"
  about_hero_image:
    type: image
    label: "About: Main Portrait"
  contact_title:
    label: "Contact: Title"
  contact_subtitle:
    label: "Contact: Subtitle"
  thank_you_header:
    label: "Thank You: Page Header"
  thank_you_body:
    type: html
    label: "Thank You: Message Body"
  nav_portfolio:
    label: "Nav: Portfolio Link"
  nav_about:
    label: "Nav: About Link"
  nav_contact:
    label: "Nav: Contact Link"