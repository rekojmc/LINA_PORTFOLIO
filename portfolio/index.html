<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="alternate" hreflang="es" href="https://linahernandezv.com/" />
        <link rel="alternate" hreflang="en" href="https://linahernandezv.com/" />
        <link rel="alternate" hreflang="x-default" href="https://linahernandezv.com/" />
        <link rel="canonical" href="https://linahernandezv.com/portfolio/" />

        <title data-i18n="site_title">Portfolio | Lina Hernandez</title>
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400;600&family=Mr+De+Haviland&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="../style.css">
        <link rel="icon" type="image/png" href="../images/icons/lina-96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="../images/icons/lina-favicon.svg" />
        <link rel="shortcut icon" href="../images/icons/lina-favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="../images/icons/lina-apple.png" />
        <meta name="apple-mobile-web-app-title" content="Lina Hernandez" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        
        <script src="../main.js"></script>
        <script src="../components.js" defer></script>
    </head>
    <body>
        <div id="global-nav"></div>
        
        <main class="gallery-wrapper" id="gallery">
            <div id="portfolio-gallery" class="masonry-grid">
                <div id="gallery-loader" class="gallery-loader">
                    <div class="spinner"></div>
                    <p data-i18n="loading_text">Curating Collection...</p>
                </div>
            </div>
        </main>

        <div id="lightbox" class="lightbox">
            <div class="lb-nav-zone left" onclick="changeLightbox(-1)">
                <div class="lb-arrow prev"></div>
            </div>
            
            <div class="lb-nav-zone right" onclick="changeLightbox(1)">
                <div class="lb-arrow next"></div>
            </div>

            <div id="lightbox-content-container"></div>
            
            <div id="lb-counter">01 / 00</div>
            <span class="close-lightbox" onclick="closeLightbox(event)">&times;</span>
        </div>

        <div id="global-footer"></div>

        <script>
            // 1. GLOBAL VARIABLES
            let allGalleryFiles = []; 
            let currentLightboxIndex = 0;
            let counterTimeout; // For the auto-hide timer

            async function loadDynamicGallery() {
                const loader = document.getElementById('gallery-loader');
                const gallery = document.getElementById('portfolio-gallery');

                try {
                    const response = await fetch('../images/portfolio/portfolio-manifest.json');
                    allGalleryFiles = await response.json(); 
                    allGalleryFiles.reverse(); 

                    allGalleryFiles.forEach((fileName, index) => {
                        const item = document.createElement('div');
                        item.className = 'gallery-item';
                        
                        // Masonry Logic
                        const col = index % 4; 
                        let isTall = (index + 1) % 3 === 0;
                        let isWide = (index + 1) % 3 === 0;

                        if (isWide && col === 3) { isWide = false; isTall = false; }
                        if (isTall || index === 0) item.classList.add('tall');
                        if (isWide || index === 0) item.classList.add('wide');

                        const isVideo = fileName.toLowerCase().endsWith('.mp4') || fileName.toLowerCase().endsWith('.mov');
                        const filePath = `../images/portfolio/${fileName}`;

                        if (isVideo) {
                            item.innerHTML = `
                                <video src="${filePath}" muted loop playsinline class="gallery-video"></video>
                                <div class="play-overlay-icon"><i class="fas fa-play"></i></div>
                            `;
                            const video = item.querySelector('video');
                            item.onmouseenter = () => video.play().catch(() => {});
                            item.onmouseleave = () => { video.pause(); video.currentTime = 0; };
                        } else {
                            const img = document.createElement('img');
                            img.src = filePath;
                            img.loading = "lazy";
                            item.appendChild(img);
                        }

                        item.onclick = () => openLightbox(index);
                        gallery.appendChild(item);
                    });

                    if (loader) loader.classList.add('loader-hidden');

                } catch (error) {
                    console.error("Gallery failed:", error);
                    if (loader) loader.classList.add('loader-hidden');
                }
            }

            // 2. COUNTER AUTO-HIDE HELPER
            function flashCounter() {
                const counter = document.getElementById('lb-counter');
                if (!counter) return;

                // Show it
                counter.classList.add('visible');

                // Reset existing timer
                clearTimeout(counterTimeout);

                // Hide after 3 seconds
                counterTimeout = setTimeout(() => {
                    counter.classList.remove('visible');
                }, 1000);
            }

            // 3. PRO LIGHTBOX LOGIC
            function openLightbox(index) {
                currentLightboxIndex = index;
                const lb = document.getElementById('lightbox');
                const container = document.getElementById('lightbox-content-container');
                const counter = document.getElementById('lb-counter');
                
                const fileName = allGalleryFiles[currentLightboxIndex];
                const isVideo = fileName.toLowerCase().endsWith('.mp4') || fileName.toLowerCase().endsWith('.mov');
                const filePath = `../images/portfolio/${fileName}`;

                container.innerHTML = ''; 

                if (isVideo) {
                    const video = document.createElement('video');
                    video.src = filePath;
                    video.controls = true;
                    video.autoplay = true;
                    video.style.maxWidth = '90%';
                    container.appendChild(video);
                } else {
                    const img = document.createElement('img');
                    img.src = filePath;
                    img.style.maxWidth = '90%';
                    img.className = 'lb-fade-in'; 
                    container.appendChild(img);
                }

                if (counter) {
                    const total = allGalleryFiles.length;
                    counter.innerText = `${(index + 1).toString().padStart(2, '0')} / ${total.toString().padStart(2, '0')}`;
                }

                lb.classList.add('active');
                document.body.style.overflow = 'hidden'; 
                
                flashCounter(); // Trigger visibility
            }

            function changeLightbox(step) {
                currentLightboxIndex += step;
                
                if (currentLightboxIndex >= allGalleryFiles.length) {
                    currentLightboxIndex = 0; 
                } else if (currentLightboxIndex < 0) {
                    currentLightboxIndex = allGalleryFiles.length - 1; 
                }
                
                openLightbox(currentLightboxIndex);
            }

            function closeLightbox(event) {
                if (event) event.stopPropagation();
                
                const lb = document.getElementById('lightbox');
                const container = document.getElementById('lightbox-content-container');
                
                lb.classList.remove('active');
                if (container) container.innerHTML = '';
                document.body.style.overflow = ''; 
            }

            // 4. KEYBOARD & INIT
            document.addEventListener('keydown', (e) => {
                const lb = document.getElementById('lightbox');
                if (!lb || !lb.classList.contains('active')) return;

                if (e.key === "ArrowRight") changeLightbox(1);
                if (e.key === "ArrowLeft") changeLightbox(-1);
                if (e.key === "Escape") closeLightbox();
            });

            document.addEventListener('DOMContentLoaded', () => {
                loadDynamicGallery();
            });
        </script>
    </body>
</html>
