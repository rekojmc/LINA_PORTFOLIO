name: Midnight Media Sync
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install google-api-python-client google-auth cloudinary

      - name: Run Mirror & Manifest Script
        env:
          GDRIVE_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          PYTHONUNBUFFERED: 1 
        run: python scripts/sync_images.py

      - name: Save Changes to Repo
        run: |
          git config --global user.name 'Lina Sync Bot'
          git config --global user.email 'actions@github.com'
          git add .
          
          # Check if there are changes (including the sync_report.txt)
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 Sync Update: $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push
          else
            echo "No changes found even with report file. Something is wrong with the disk write."
          fi
