name: Midnight Media Sync
on:
  schedule:
    - cron: '0 0 * * *' # Runs at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to commit the JSON file
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth cloudinary

      - name: Run Sync Script
        env:
          GDRIVE_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/sync_images.py

      - name: Commit and Push Manifest
        run: |
          git config --global user.name 'Cloudinary Sync Bot'
          git config --global user.email 'actions@github.com'
          git add gallery-data.json
          # Only commit if there are actual changes in the JSON
          git commit -m "🤖 Auto-update gallery manifest [skip ci]" || echo "No changes to commit"
          git push
