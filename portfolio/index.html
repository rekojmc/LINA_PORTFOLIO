	<body>
        <div id="global-nav"></div>
        <div>
            <p></p>
            <p></p>
        </div>
		<main class="gallery-wrapper" id="gallery">
			<div id="portfolio-gallery" class="masonry-grid">
				<div id="gallery-loader" class="gallery-loader">
					<div class="spinner"></div>
					<p data-i18n="loading_text">Curating Collection...</p>
				</div>
			</div>
		</main>

		<div id="lightbox" class="lightbox" onclick="closeLightbox()">
			<span class="close-lightbox">&times;</span>
			<div id="lightbox-content-container"></div>
		</div>

		<div id="global-footer"></div>

		<script>
			const gallery = document.getElementById('portfolio-gallery');

    const p1Img = document.querySelector('.panel-1 img');
    const p2Img = document.querySelector('.panel-2 img');
    const p3Img = document.querySelector('.panel-3 img');

async function loadDynamicGallery() {
    const loader = document.getElementById('gallery-loader');
    
    // FAIL-SAFE: If anything hangs, hide the loader after 5 seconds
    const failSafe = setTimeout(() => {
        if (loader) loader.classList.add('loader-hidden');
    }, 5000);

    try {
        const response = await fetch('../images/portfolio/portfolio-manifest.json');
        let files = await response.json();

        // Shuffle logic (Fisher-Yates)
        for (let i = files.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [files[i], files[j]] = [files[j], files[i]];
        }

   files.forEach((fileName, index) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    
	// Inside your gallery generation loop:
	const col = index % 4; // 0=Col1, 1=Col2, 2=Col3, 3=Col4

	let isTall = (index + 1) % 3 === 0;
	let isWide = (index + 1) % 3 === 0;

	// SAFETY GUARD: "Force Regular" Logic
	// If it's in the 4th column, it CANNOT be wide. 
	 if (isWide && col === 3) {
	 	isWide = false;
        isTall = false; // Forcing regular size
	}

	// // If it's Wide, we should also ensure it's not Tall 
	// // (avoiding the 'Giant Square' which causes the most gaps)
	// if (isWide && isTall) {
	// 	isTall = false; 
	// }

	if (isTall || index === 0) item.classList.add('tall');
	if (isWide || index === 0) item.classList.add('wide');


    const isVideo = fileName.toLowerCase().endsWith('.mp4') || fileName.toLowerCase().endsWith('.mov');
    const filePath = `../images/portfolio/${fileName}`;

    if (isVideo) {
        // We inject the video AND the play icon div
        item.innerHTML = `
            <video src="${filePath}" muted loop playsinline class="gallery-video"></video>
            <div class="play-overlay-icon"><i class="fas fa-play"></i></div>
        `;
        const video = item.querySelector('video');

        item.onmouseenter = () => video.play().catch(() => {});
        item.onmouseleave = () => {
            video.pause();
            video.currentTime = 0;
        };
    } else {
        const img = document.createElement('img');
        img.src = filePath;
        img.loading = "lazy";
        item.appendChild(img);
    }

    // CLICK TO OPEN (Fixes your "click not working" issue)
    item.onclick = () => openLightbox(filePath, isVideo);

    gallery.appendChild(item);
});

        // SUCCESS: Remove the loader and clear the failsafe
        clearTimeout(failSafe);
        if (loader) loader.classList.add('loader-hidden');

    } catch (error) {
        console.error("Gallery failed:", error);
        // ERROR: Hide loader even on failure so page isn't broken
        if (loader) loader.classList.add('loader-hidden');
    }
}
			function openLightbox(src, isVideo) {
				const lb = document.getElementById('lightbox');
				const container = document.getElementById('lightbox-content-container');
				container.innerHTML = ''; 

				if (isVideo) {
					const video = document.createElement('video');
					video.src = src;
					video.controls = true;
					video.autoplay = true;
					video.style.maxWidth = '90%';
					container.appendChild(video);
				} else {
					const img = document.createElement('img');
					img.src = src;
					img.style.maxWidth = '90%';
					container.appendChild(img);
				}
				lb.classList.add('active');
			}

			function closeLightbox() {
				document.getElementById('lightbox').classList.remove('active');
                document.getElementById('lightbox-content-container').innerHTML = '';
			}


			

			document.addEventListener('DOMContentLoaded', () => {
            // Kick off the dynamic hero engine
			loadDynamicGallery();
        });
		</script>
	</body>
</html>
