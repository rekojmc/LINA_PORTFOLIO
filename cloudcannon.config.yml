# 1. GLOBAL PATHS
paths:
  static: /
  uploads: / # Global default

# 2. COLLECTIONS CONFIGURATION
collections_config:
  pages:
    path: /
    name: Pages
    icon: description
    filter: 
      exclude: [images, data, node_modules, js, css] # Keep pages clean

  data:
    path: data
    name: Site Content (JSON)
    icon: language

  # --- THE IMAGE COLLECTIONS (The Ninja Phone Gallery) ---
  main_hero:
    path: images/main
    name: "Hero Images"
    icon: add_a_photo
    display_type: grid
    output: false
    filter: strict
    allow_ext: [.jpg, .jpeg, .png, .webp, .mp4, .mov]
    config:
      uploads:
        default:
          target: images/main

  portfolio_images:
    path: images/portfolio
    name: "Portfolio Photos"
    icon: collections
    display_type: grid
    output: false
    filter: strict
    allow_ext: [.jpg, .jpeg, .png, .webp, .mp4, .mov]
    config:
      uploads:
        default:
          target: images/portfolio

  about_images:
    path: images/about
    name: "About Photos"
    icon: person
    display_type: grid
    output: false
    filter: strict
    allow_ext: [.jpg, .jpeg, .png, .webp]
    config:
      uploads:
        default:
          target: images/about

  contact_images:
    path: images/contact
    name: "Contact Photos"
    icon: alternate_email
    display_type: grid
    output: false
    filter: strict
    allow_ext: [.jpg, .jpeg, .png, .webp]
    config:
      uploads:
        default:
          target: images/contact

# 3. SIDEBAR ORGANIZATION (Makes the UI cleaner for Lina)
_collection_groups:
  - heading: Content
    collections: [pages, data]
  - heading: Visual Assets
    collections: [main_hero, portfolio_images, about_images, contact_images]

# 4. INPUT DEFINITIONS (Your existing inputs)
_inputs:
  hero_title:
    label: 'Home: Main Title'
    cascade: true
  hero_subtitle:
    label: 'Home: Sub-headline'
    cascade: true
  about_heading:
    label: 'About: Headline'
    cascade: true
  about_bio:
    type: markdown
    label: 'About: Full Biography'
    cascade: true
  sign_off:
    label: 'About: Signature Sign-off'
    cascade: true
  about_hero_image:
    type: image
    label: 'About: Main Portrait'
    cascade: true
  contact_title:
    label: 'Contact: Title'
    cascade: true
  contact_subtitle:
    label: 'Contact: Subtitle'
    cascade: true
  contact_success:
    label: 'Contact: Quick Success Message (for form)'
    cascade: true
  thank_you_header:
    label: 'Thank You: Page Header'
    cascade: true
  thank_you_body:
    type: textarea
    label: 'Thank You: Message Body'
    cascade: true
  thank_you_redirect:
    label: 'Thank You: Redirect Link Text'
    cascade: true
  nav_portfolio:
    label: 'Nav: Portfolio Link'
    cascade: true
  nav_about:
    label: 'Nav: About Link'
    cascade: true
  nav_contact:
    label: 'Nav: Contact Link'
    cascade: true
  copyright_rights:
    label: 'Footer: Copyright Text'
    cascade: true

# 5. STRUCTURES & DATA
_structures:
  translation_entry:
    style: select
    values:
      - label: Spanish
        data: data.translations.es
      - label: English
        data: data.translations.en

data_config:
  translations:
    path: translations.json
    format: json