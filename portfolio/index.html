    <body>
        <div id="global-nav"></div>
        
        <main class="gallery-wrapper-portfolio" id="gallery">
            <div id="portfolio-gallery" class="masonry-grid">
                <div id="gallery-loader" class="gallery-loader">
                    <div class="spinner"></div>
                    <p data-i18n="loading_text">Curating Collection...</p>
                </div>
            </div>
        </main>

        <div id="lightbox" class="lightbox">
            <div class="lb-nav-zone left" onclick="changeLightbox(-1)">
                <div class="lb-arrow prev"></div>
            </div>
            
            <div class="lb-nav-zone right" onclick="changeLightbox(1)">
                <div class="lb-arrow next"></div>
            </div>

            <div id="lightbox-content-container"></div>
            
            <div id="lb-counter">01 / 00</div>
            <span class="close-lightbox" onclick="closeLightbox(event)">&times;</span>
        </div>

        <div id="global-footer"></div>

        <script>
            let allGalleryFiles = []; 
            let currentLightboxIndex = 0;
            let counterTimeout;

function getOptimizedUrl(url, isVideo = false) {
    // l_lina_logo: refers to an image named 'lina_logo' uploaded to your Cloudinary
    // o_30: 30% opacity
    // g_south_east: bottom right corner
    const watermark = 'l_lina_logo,o_30,w_200,g_south_east,x_20,y_20/';
    
    const transform = isVideo 
        ? 'vc_auto,q_auto,w_800' 
        : `f_auto,q_auto,w_800,${watermark}`; // Slap it on!
        
    return url.replace('/upload/', `/upload/${transform}/`);
}

            async function loadDynamicGallery() {
                const loader = document.getElementById('gallery-loader');
                const gallery = document.getElementById('portfolio-gallery');

                try {
                    // Fetch the local JSON created by the Python script
                    const response = await fetch('portfolio-gallery.json');
                    const data = await response.json();
                    
                    // Since the split manifest only contains portfolio items, 'data' is the array
                    allGalleryFiles = data || []; 
                    allGalleryFiles.reverse(); // Newest first

                    allGalleryFiles.forEach((fileObj, index) => {
                        const item = document.createElement('div');
                        item.className = 'gallery-item';
                        
                        // Masonry Rhythm Logic
                        const col = index % 4; 
                        let isTall = (index + 1) % 3 === 0;
                        let isWide = (index + 1) % 3 === 0;

                        if (isWide && col === 3) { isWide = false; isTall = false; }
                        if (isTall || index === 0) item.classList.add('tall');
                        if (isWide || index === 0) item.classList.add('wide');

                        const isVideo = fileObj.type === 'video';
                        const thumbnailPath = getOptimizedUrl(fileObj.url, isVideo);

                        if (isVideo) {
                            item.innerHTML = `
                                <video src="${thumbnailPath}" muted loop playsinline class="gallery-video"></video>
                                <div class="play-overlay-icon"><i class="fas fa-play"></i></div>
                            `;
                            const video = item.querySelector('video');
                            item.onmouseenter = () => video.play().catch(() => {});
                            item.onmouseleave = () => { video.pause(); video.currentTime = 0; };
                        } else {
                            const img = document.createElement('img');
                            img.src = thumbnailPath;
                            img.loading = "lazy";
                            img.alt = "Lina Hernandez Photography";
                            item.appendChild(img);
                        }

                        item.onclick = () => openLightbox(index);
                        gallery.appendChild(item);
                    });

                    if (loader) loader.classList.add('loader-hidden');

                } catch (error) {
                    console.error("Manifest load error:", error);
                    if (loader) loader.classList.add('loader-hidden');
                }
            }

            function flashCounter() {
                const counter = document.getElementById('lb-counter');
                if (!counter) return;
                counter.classList.add('visible');
                clearTimeout(counterTimeout);
                counterTimeout = setTimeout(() => counter.classList.remove('visible'), 1500);
            }

            function openLightbox(index) {
                currentLightboxIndex = index;
                const lb = document.getElementById('lightbox');
                const container = document.getElementById('lightbox-content-container');
                const counter = document.getElementById('lb-counter');
                
                const fileObj = allGalleryFiles[currentLightboxIndex];
                const isVideo = fileObj.type === 'video';
                
                // Lightbox quality: 1600px width
                const lbTransform = isVideo ? 'vc_auto,q_auto,w_1600' : 'f_auto,q_auto,w_1600';
                const lbPath = fileObj.url.replace('/upload/', `/upload/${lbTransform}/`);

                container.innerHTML = ''; 

                if (isVideo) {
                    const video = document.createElement('video');
                    video.src = lbPath;
                    video.controls = true;
                    video.autoplay = true;
                    video.style.maxWidth = '90%';
                    video.style.maxHeight = '85vh';
                    container.appendChild(video);
                } else {
                    const img = document.createElement('img');
                    img.src = lbPath;
                    img.className = 'lb-fade-in';
                    img.style.maxWidth = '90%';
                    img.style.maxHeight = '85vh';
                    container.appendChild(img);
                }

                if (counter) {
                    counter.innerText = `${(index + 1).toString().padStart(2, '0')} / ${allGalleryFiles.length.toString().padStart(2, '0')}`;
                }

                lb.classList.add('active');
                document.body.style.overflow = 'hidden'; 
                flashCounter(); 
            }

            function changeLightbox(step) {
                currentLightboxIndex += step;
                if (currentLightboxIndex >= allGalleryFiles.length) currentLightboxIndex = 0; 
                else if (currentLightboxIndex < 0) currentLightboxIndex = allGalleryFiles.length - 1; 
                openLightbox(currentLightboxIndex);
            }

            function closeLightbox(event) {
                if (event) event.stopPropagation();
                const lb = document.getElementById('lightbox');
                const container = document.getElementById('lightbox-content-container');
                lb.classList.remove('active');
                if (container) container.innerHTML = '';
                document.body.style.overflow = ''; 
            }

            document.addEventListener('keydown', (e) => {
                const lb = document.getElementById('lightbox');
                if (!lb || !lb.classList.contains('active')) return;
                if (e.key === "ArrowRight") changeLightbox(1);
                if (e.key === "ArrowLeft") changeLightbox(-1);
                if (e.key === "Escape") closeLightbox();
            });

            document.addEventListener('DOMContentLoaded', loadDynamicGallery);
        </script>
