        <script>
/* ================================================================
   LINA HERNANDEZ - ABOUT PAGE UNIFIED ENGINE
   Features: AI Face Detection, Synced 2x Watermark, Like Logic, Easter Egg
================================================================ */

// 1. GLOBAL STATE
let allGalleryFiles = []; 
let currentLightboxIndex = 0;
let counterTimeout;
let userLikes = JSON.parse(localStorage.getItem('lina_about_likes')) || {};
let baseLikes = 1240;

/**
 * SMART OPTIMIZER: Handles Face-Centering, Watermarking, and Quality
 * @param {string} url - Original Cloudinary URL
 * @param {boolean} isVideo - Flag for video content
 * @param {boolean} isLightbox - Flag for high-res lightbox view
 */
function getOptimizedUrl(url, isVideo = false, isLightbox = false) {
    const width = isLightbox ? 1600 : 800;
    
    // FACE DETECTION & SMART CROP
    // c_fill: forces the crop to fill the box
    // g_face: uses AI to center the crop on the subject's face
    const smartCrop = `c_fill,g_face,w_${width}`;

    // WATERMARK LOGIC (Standardized at 2x size: w_800)
    const watermark = 'l_lina_logo,o_0,w_800,g_south_east,x_20,y_20/';
    
    let transform = "";
    if (isVideo) {
        // AI Face-centering works for videos too
        transform = `vc_auto,q_auto,${smartCrop}`;
    } else {
        // Sync watermark and face-centering on images
        transform = `f_auto,q_auto,${smartCrop},${watermark}`;
    }
        
    return url.replace('/upload/', `/upload/${transform}/`);
}

// 2. LIKE / APPRECIATION LOGIC
function updateGlobalCounter() {
    const userTotal = Object.keys(userLikes).length;
    const display = document.getElementById('global-like-counter');
    if (display) display.innerText = (baseLikes + userTotal).toLocaleString();
}

function toggleLike(fileObj, event) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }
    
    const photoId = fileObj.url;
    if (!photoId) return;

    if (userLikes[photoId]) {
        delete userLikes[photoId];
    } else {
        userLikes[photoId] = true;
        if (window.gtag) {
            gtag('event', 'heart_click', { 'image_url': photoId });
        }
    }

    localStorage.setItem('lina_about_likes', JSON.stringify(userLikes));
    updateGlobalCounter();
    refreshLikeUI(photoId);
}

function refreshLikeUI(photoId) {
    const isLiked = userLikes[photoId];
    
    const lbHeart = document.getElementById('lb-heart');
    if (lbHeart) lbHeart.className = isLiked ? 'fas fa-heart' : 'far fa-heart';

    const allHearts = document.querySelectorAll('.fa-heart[data-url]');
    allHearts.forEach(heart => {
        if (heart.getAttribute('data-url') === photoId) {
            heart.className = isLiked ? 'fas fa-heart' : 'far fa-heart';
        }
    });
}

function handleLikeClick(event) {
    const fileObj = allGalleryFiles[currentLightboxIndex];
    if (fileObj) toggleLike(fileObj, event);
}

// 3. GALLERY ENGINE (Masonry Grid)
async function loadAboutGallery() {
    const loader = document.getElementById('about-loader');
    const gallery = document.getElementById('about-gallery');

    try {
        const response = await fetch('about-gallery.json');
        const data = await response.json();
        allGalleryFiles = data || []; 
        allGalleryFiles.reverse(); 

        allGalleryFiles.forEach((fileObj, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            // MASONRY RHYTHM
            const col = index % 4; 
            let isTall = (index + 1) % 5 === 0;
            let isWide = (index + 1) % 5 === 0;
            if (isWide && col === 3) { isWide = false; isTall = false; }
            if (isTall || index === 0) item.classList.add('tall');
            if (isWide || index === 0) item.classList.add('wide');

            // HEART OVERLAY
            const likeOverlay = document.createElement('div');
            likeOverlay.className = 'grid-like-overlay';
            likeOverlay.style.zIndex = "10";
            const isLikedClass = userLikes[fileObj.url] ? 'fas' : 'far';
            likeOverlay.innerHTML = `<i class="${isLikedClass} fa-heart" data-url="${fileObj.url}"></i>`;
            likeOverlay.addEventListener('click', (e) => toggleLike(fileObj, e));
            item.appendChild(likeOverlay);

            // MEDIA CONTENT (With Face AI)
            const isVideo = fileObj.type === 'video';
            const thumbPath = getOptimizedUrl(fileObj.url, isVideo, false);

            if (isVideo) {
                item.innerHTML += `
                    <div class="video-container-grid">
                        <video src="${thumbPath}" muted loop playsinline class="gallery-video"></video>
                        <div class="play-overlay-icon"><i class="fas fa-play"></i></div>
                    </div>
                `;
            } else {
                const img = document.createElement('img');
                img.src = thumbPath;
                img.loading = "lazy";
                item.appendChild(img);
            }

            // Click listener for Lightbox
            item.addEventListener('click', (e) => {
                if (!e.target.classList.contains('fa-heart') && !e.target.classList.contains('grid-like-overlay')) {
                    openLightbox(index);
                }
            });

            gallery.appendChild(item);
        });

        if (loader) loader.classList.add('loader-hidden');
    } catch (error) { 
        console.error("Gallery Error:", error);
        if (loader) loader.classList.add('loader-hidden');
    }
}

// 4. LIGHTBOX LOGIC
function openLightbox(index) {
    currentLightboxIndex = index;
    const lb = document.getElementById('lightbox');
    const container = document.getElementById('lightbox-content-container');
    const counter = document.getElementById('lb-counter');
    
    const fileObj = allGalleryFiles[currentLightboxIndex];
    const isVideo = fileObj.type === 'video';
    
    // THE FIX: Use getOptimizedUrl for High-Res + Face AI + 2x Watermark
    const lbPath = getOptimizedUrl(fileObj.url, isVideo, true);

    container.innerHTML = isVideo ? 
        `<video src="${lbPath}" controls autoplay style="max-width:90%; max-height:80vh;"></video>` : 
        `<img src="${lbPath}" class="lb-fade-in" style="max-width:90%; max-height:80vh;">`;

    if (counter) {
        counter.innerText = `${(index + 1).toString().padStart(2, '0')} / ${allGalleryFiles.length.toString().padStart(2, '0')}`;
    }

    refreshLikeUI(fileObj.url);
    lb.classList.add('active');
    document.body.style.overflow = 'hidden'; 
    flashCounter();
}

function changeLightbox(step) {
    currentLightboxIndex += step;
    if (currentLightboxIndex >= allGalleryFiles.length) currentLightboxIndex = 0;
    else if (currentLightboxIndex < 0) currentLightboxIndex = allGalleryFiles.length - 1;
    openLightbox(currentLightboxIndex);
}

function closeLightbox(event) {
    if (event) event.stopPropagation();
    const lb = document.getElementById('lightbox');
    const container = document.getElementById('lightbox-content-container');
    lb.classList.remove('active');
    if (container) container.innerHTML = '';
    document.body.style.overflow = ''; 
}

function flashCounter() {
    const counter = document.getElementById('lb-counter');
    if (!counter) return;
    counter.classList.add('visible');
    clearTimeout(counterTimeout);
    counterTimeout = setTimeout(() => { counter.classList.remove('visible'); }, 2000);
}

// 5. NAVIGATION & UTILITIES
document.addEventListener('keydown', (e) => {
    const lb = document.getElementById('lightbox');
    if (!lb || !lb.classList.contains('active')) return;
    if (e.key === "ArrowRight") changeLightbox(1);
    if (e.key === "ArrowLeft") changeLightbox(-1);
    if (e.key === "Escape") closeLightbox();
});

function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu-overlay');
    menu.classList.toggle('active');
    document.body.style.overflow = menu.classList.contains('active') ? 'hidden' : '';
}

// 6. THE COLOMBIA EASTER EGG
let typedBuffer = "";
const secretWord = "colombia";

document.addEventListener('keydown', (e) => {
    typedBuffer += e.key.toLowerCase();
    if (typedBuffer.length > 10) {
        typedBuffer = typedBuffer.substring(typedBuffer.length - 10);
    }
    if (typedBuffer.includes(secretWord)) {
        triggerEasterEgg();
        typedBuffer = ""; 
    }
});

function triggerEasterEgg() {
    const overlay = document.getElementById('easter-egg-overlay');
    if (!overlay) return;
    overlay.classList.add('ee-active');
    setTimeout(() => {
        overlay.classList.remove('ee-active');
    }, 2500);
}

// INITIALIZE
document.addEventListener('DOMContentLoaded', () => {
    updateGlobalCounter();
    const lang = localStorage.getItem('preferredLang') || 'en';
    setTimeout(() => { if (window.updatePageText) updatePageText(lang); }, 150); 
    loadAboutGallery();
});
        </script>

    </div>
