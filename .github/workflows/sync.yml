name: Midnight Sync
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Fixes deprecation warning
      - name: Set up Python
        uses: actions/setup-python@v5 # Fixes deprecation warning
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install google-api-python-client google-auth cloudinary
      - name: Run Sync Script
        env:
          GDRIVE_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/sync_images.py
