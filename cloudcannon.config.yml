paths:
  uploads: images/
  static: /
collections_config:
  pages:
    path: /
    name: Pages
    icon: description
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  data:
    path: data
    name: Site Content (JSON)
    icon: language
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
_inputs:
  hero_title:
    label: 'Home: Main Title'
    cascade: true
  hero_subtitle:
    label: 'Home: Sub-headline'
    cascade: true
  about_heading:
    label: 'About: Headline'
    cascade: true
  about_bio:
    type: markdown
    label: 'About: Full Biography'
    cascade: true
  sign_off:
    label: 'About: Signature Sign-off'
    cascade: true
  about_hero_image:
    type: image
    label: 'About: Main Portrait'
    cascade: true
  contact_title:
    label: 'Contact: Title'
    cascade: true
  contact_subtitle:
    label: 'Contact: Subtitle'
    cascade: true
  contact_success:
    label: 'Contact: Quick Success Message (for form)'
    cascade: true
  thank_you_header:
    label: 'Thank You: Page Header'
    cascade: true
  thank_you_body:
    type: textarea
    label: 'Thank You: Message Body'
    cascade: true
  thank_you_redirect:
    label: 'Thank You: Redirect Link Text'
    cascade: true
  nav_portfolio:
    label: 'Nav: Portfolio Link'
    cascade: true
  nav_about:
    label: 'Nav: About Link'
    cascade: true
  nav_contact:
    label: 'Nav: Contact Link'
    cascade: true
  copyright_rights:
    label: 'Footer: Copyright Text'
    cascade: true
_structures:
  translation_entry:
    style: select
    values:
      - label: Spanish
        data: data.translations.es
      - label: English
        data: data.translations.en
data_config:
  translations:
    path: data/translations.json
    format: json
editor:
  default_path:
timezone: Etc/UTC
