    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <link rel="alternate" hreflang="es" href="https://linahernandezv.com/" />
    <link rel="alternate" hreflang="en" href="https://linahernandezv.com/" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="icon" type="image/png"

    <link rel="icon" type="image/svg+xml"

    <link rel="shortcut icon"
        href="https://res.cloudinary.com/linahernandezv/image/upload//Lina_Portfolio/icons/lina-favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180"
        href="https://res.cloudinary.com/linahernandezv/image/upload//Lina_Portfolio/icons/lina-apple.png" />

    <script src="../components.js" defer></script>
    <script src="/socials.js"></script>
</head>

<body>
    <div id="global-nav"></div>

    <main class="gallery-wrapper-portfolio" id="gallery">
        <div id="portfolio-gallery" class="masonry-grid">
            <div id="gallery-loader" class="gallery-loader">
                <div class="spinner"></div>
                <p data-i18n="loading_text">Curating Collection...</p>
            </div>
        </div>
    </main>

    <div id="lightbox" class="lightbox">
        <button id="slideshow-toggle" data-i18n="play_slideshow" onclick="toggleAutoplay(event)">Play Slideshow</button>

        <div class="lb-nav-zone left" onclick="changeLightbox(-1)">
            <div class="lb-arrow prev"></div>
        </div>
        <div class="lb-nav-zone right" onclick="changeLightbox(1)">
            <div class="lb-arrow next"></div>
        </div>

        <div id="lightbox-content-container"></div>
        <div id="lb-counter">01 / 00</div>
        <span class="close-lightbox" onclick="closeLightbox(event)">&times;</span>
    </div>

    <div id="global-footer"></div>

    <script>
        /* ================================================================
           LINA HERNANDEZ - PORTFOLIO ENGINE (V4.0 - SMART SLIDESHOW)
        ================================================================ */

        // 1. GLOBAL STATE
        let allGalleryFiles = [];
        let currentLightboxIndex = 0;
        let counterTimeout;
        let isAutoplayActive = false;
        let autoplayTimer;
        const SLIDE_DURATION = 5000; // 5 Seconds

        /**
         * SMART OPTIMIZER: Chained transformations to prevent watermark expansion
         */
        function getOptimizedUrl(url, isVideo = false, isLightbox = false) {
            const smartCropIMG = `c_fill,g_face`;
            const smartCropVID = `c_fill/g_auto:person`;

            // We use fl_layer_apply to anchor the watermark specifically to the final image size
            //const watermark = `l_lina-logo-initial,c_scale,fl_relative,w_0.1/fl_layer_apply,g_north_west,x_0,y_0/l_lina-logo-initial,c_scale,fl_relative,w_0.1/fl_layer_apply,g_north_east,x_0,y_0/l_lina-logo-initial,c_scale,fl_relative,w_0.1/fl_layer_apply,g_south_west,x_0,y_0/l_lina-logo-initial,c_scale,fl_relative,w_0.1/fl_layer_apply,g_south_east,x_0,y_0`;
            const watermark = `l_lhv-2,c_scale,fl_relative,w_0.1/fl_layer_apply,g_south_east,x_50,y_50`;

            let transform = "";
            if (isVideo) {
                transform = `vc_auto,q_auto,${smartCropVID}/${watermark}`;
            } else {
                transform = `f_auto,q_auto,${smartCropIMG}/${watermark}`;
            }

            return url.replace('/upload/', `/upload/${transform}/`);
        }

        /**
         * GALLERY LOADER
         */
        async function loadDynamicGallery() {
            const loader = document.getElementById('gallery-loader');
            const gallery = document.getElementById('portfolio-gallery');

            try {
                const response = await fetch('portfolio-gallery.json');
                const data = await response.json();

                allGalleryFiles = (data || []).sort((a, b) => {
                    const dateA = new Date(a.date || a.created_at || 0);
                    const dateB = new Date(b.date || b.created_at || 0);
                    return dateB - dateA;
                });

                allGalleryFiles.forEach((fileObj, index) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';

                    const col = index % 4;
                    let isTall = (index + 1) % 3 === 0;
                    let isWide = (index + 1) % 3 === 0;
                    if (isWide && col === 3) { isWide = false; isTall = false; }
                    if (isTall || index === 0) item.classList.add('tall');
                    if (isWide || index === 0) item.classList.add('wide');

                    const isVideo = fileObj.type === 'video';
                    const thumbnailPath = getOptimizedUrl(fileObj.url, isVideo, false);

                    if (isVideo) {
                        item.innerHTML = `
                            <video src="${thumbnailPath}" muted loop playsinline class="gallery-video"></video>
                            <div class="play-overlay-icon"><i class="fas fa-play"></i></div>
                        `;
                        const video = item.querySelector('video');
                        item.onmouseenter = () => video.play().catch(() => { });
                        item.onmouseleave = () => { video.pause(); video.currentTime = 0; };
                    } else {
                        const img = document.createElement('img');
                        img.src = thumbnailPath;
                        img.loading = "lazy";
                        img.alt = "Lina Hernandez Portfolio";
                        item.appendChild(img);
                    }

                    item.onclick = () => openLightbox(index);
                    gallery.appendChild(item);
                });

                if (loader) loader.classList.add('loader-hidden');
            } catch (error) {
                console.error("Gallery Sync Error:", error);
                if (loader) loader.classList.add('loader-hidden');
            }
        }

        /**
         * SLIDESHOW LOGIC
         */
        function toggleAutoplay(event) {
            if (event) event.stopPropagation();
            isAutoplayActive = !isAutoplayActive;

            const btn = document.getElementById('slideshow-toggle');
            const i18n = window.currentI18n || {}; // Safely pull current language strings

            if (isAutoplayActive) {
                btn.innerText = i18n['pause_slideshow'] || "Pause Slideshow";
                btn.setAttribute('data-i18n', 'pause_slideshow');
                btn.classList.add('playing');
                startAutoplayTimer();
            } else {
                stopAutoplay();
            }
        }

        function stopAutoplay() {
            isAutoplayActive = false;
            clearTimeout(autoplayTimer);
            const btn = document.getElementById('slideshow-toggle');
            if (btn) {
                const i18n = window.currentI18n || {};
                btn.innerText = i18n['play_slideshow'] || "Play Slideshow";
                btn.setAttribute('data-i18n', 'play_slideshow');
                btn.classList.remove('playing');
            }
        }

        function startAutoplayTimer() {
            clearTimeout(autoplayTimer);
            if (!isAutoplayActive) return;

            const fileObj = allGalleryFiles[currentLightboxIndex];

            if (fileObj.type === 'video') {
                const video = document.querySelector('#lightbox-content-container video');
                if (video) {
                    video.onended = () => {
                        if (isAutoplayActive) changeLightbox(1, true);
                    };
                }
            } else {
                autoplayTimer = setTimeout(() => {
                    if (isAutoplayActive) changeLightbox(1, true);
                }, SLIDE_DURATION);
            }
        }

        /**
         * LIGHTBOX SYSTEM
         */
        function openLightbox(index) {
            currentLightboxIndex = index;
            const lb = document.getElementById('lightbox');
            const container = document.getElementById('lightbox-content-container');
            const counter = document.getElementById('lb-counter');

            const fileObj = allGalleryFiles[currentLightboxIndex];
            const isVideo = fileObj.type === 'video';
            const lbPath = getOptimizedUrl(fileObj.url, isVideo, true);

            container.innerHTML = isVideo ?
                `<video src="${lbPath}" controls autoplay class="lb-fade-in" style="max-width:90%; max-height:85vh;"></video>` :
                `<img src="${lbPath}" class="lb-fade-in" style="max-width:90%; max-height:85vh;">`;

            if (counter) {
                counter.innerText = `${(index + 1).toString().padStart(2, '0')} / ${allGalleryFiles.length.toString().padStart(2, '0')}`;
            }

            lb.classList.add('active');
            document.body.style.overflow = 'hidden';
            flashCounter();

            if (isAutoplayActive) startAutoplayTimer();
        }

        function changeLightbox(step, isAutomatic = false) {
            // Kill autoplay if user manually intervenes
            if (!isAutomatic) stopAutoplay();

            currentLightboxIndex += step;
            if (currentLightboxIndex >= allGalleryFiles.length) currentLightboxIndex = 0;
            else if (currentLightboxIndex < 0) currentLightboxIndex = allGalleryFiles.length - 1;
            openLightbox(currentLightboxIndex);
        }

        function closeLightbox(event) {
            if (event) event.stopPropagation();
            stopAutoplay();
            const lb = document.getElementById('lightbox');
            const container = document.getElementById('lightbox-content-container');
            lb.classList.remove('active');
            if (container) container.innerHTML = '';
            document.body.style.overflow = '';
        }

        function flashCounter() {
            const counter = document.getElementById('lb-counter');
            if (!counter) return;
            counter.classList.add('visible');
            clearTimeout(counterTimeout);
            counterTimeout = setTimeout(() => counter.classList.remove('visible'), 1500);
        }

        // INITIALIZE
        document.addEventListener('DOMContentLoaded', () => {
            loadDynamicGallery();
            // Keyboard Nav
            document.addEventListener('keydown', (e) => {
                const lb = document.getElementById('lightbox');
                if (!lb || !lb.classList.contains('active')) return;
                if (e.key === "ArrowRight") changeLightbox(1);
                if (e.key === "ArrowLeft") changeLightbox(-1);
                if (e.key === "Escape") closeLightbox();
            });
        });
    </script>
</body>

</html>
