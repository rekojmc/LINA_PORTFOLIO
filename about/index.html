<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title data-i18n="site_title_about">About | Lina Hernandez</title>
        <link rel="alternate" hreflang="es" href="https://linahernandezv.com/" />
        <link rel="alternate" hreflang="en" href="https://linahernandezv.com/" />
        <link rel="alternate" hreflang="x-default" href="https://linahernandezv.com/" />
        <link rel="canonical" href="https://linahernandezv.com/about/" />
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400;600&family=Mr+De+Haviland&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="../style.css">
        <link rel="icon" type="image/png" href="../images/icons/lina-96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="../images/icons/lina-favicon.svg" />
        <link rel="shortcut icon" href="../images/icons/lina-favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="../images/icons/lina-apple.png" />
        
        <script src="../main.js"></script>
        <script src="../components.js" defer></script>
    </head>
    <body class="about-page">

        <div id="global-nav"></div>

        <main id="main-content-wrapper">
            <header class="about-hero-split">
                <div class="about-text-content">
                    <h1 class="about-heading" data-i18n="about_heading">Behind the Lens</h1>
                    
                    <div class="bio-editorial-body">
                        <p class="bio-line line-1" data-i18n="about_bio_1"></p>
                        <p class="bio-line line-2" data-i18n="about_bio_2"></p>
                        <p class="bio-line line-3" data-i18n="about_bio_3"></p>
                    </div>
                    
                    <div class="signature-block">
                        <p class="sign-off" data-i18n="sign_off">Con mucho amor,</p> 
                        <p class="signature">Lina Hernandez</p>
                    </div>
                </div>
                <div class="about-main-image">
                    <img src="../images/about/hero.jpg" alt="Lina Hernandez">
                </div>
            </header>

            <section class="gallery-wrapper">
                <div id="about-gallery" class="masonry-grid">
                    <div id="about-loader" class="gallery-loader">
                        <div class="spinner"></div>
                        <p data-i18n="loading_text">Curating Collection...</p>
                    </div>
                </div>
            </section>
        </main>

        <div id="lightbox" class="lightbox" onclick="closeLightbox()">
            <span class="close-lightbox">&times;</span>
            <div id="lightbox-content-container"></div>
        </div>

        <div id="global-footer"></div>

        <script>
            // 1. GALLERY ENGINE (Remains the same, just simplified paths)
            async function loadAboutGallery() {
                const loader = document.getElementById('about-loader');
                const gallery = document.getElementById('about-gallery');
                if (!gallery) return;

                try {
                    const response = await fetch('../images/about/about-manifest.json');
                    const files = await response.json();
                    
                    // Shuffle for fresh feel
                    files.sort(() => Math.random() - 0.5);

                    files.forEach((fileName, index) => {
                        const item = document.createElement('div');
                        item.className = 'gallery-item';
                        
                        // Masonry Logic
                        const col = index % 4;
                        let isTall = (index + 1) % 3 === 0;
                        let isWide = (index + 1) % 6 === 0;
                        if (isWide && col === 3) isWide = false;
                        if (isWide && isTall) isTall = false;

                        if (isTall || index === 0) item.classList.add('tall');
                        if (isWide || index === 0) item.classList.add('wide');

                        const isVideo = fileName.toLowerCase().endsWith('.mp4') || fileName.toLowerCase().endsWith('.mov');
                        const filePath = `../images/about/${fileName}`;

                        if (isVideo) {
                            item.innerHTML = `
                                <video src="${filePath}" muted loop playsinline class="gallery-video"></video>
                                <div class="play-overlay-icon"><i class="fas fa-play"></i></div>
                            `;
                            const video = item.querySelector('video');
                            item.onmouseenter = () => video.play().catch(() => {});
                            item.onmouseleave = () => { video.pause(); video.currentTime = 0; };
                        } else {
                            const img = document.createElement('img');
                            img.src = filePath;
                            img.loading = "lazy";
                            item.appendChild(img);
                        }

                        item.onclick = () => openLightbox(filePath, isVideo);
                        gallery.appendChild(item);
                    });
                } catch (e) { console.error("Gallery Error:", e); }
                finally { if (loader) loader.classList.add('loader-hidden'); }
            }

            // 2. LIGHTBOX (Remains consistent)
            function openLightbox(src, isVideo) {
                const lb = document.getElementById('lightbox');
                const container = document.getElementById('lightbox-content-container');
                container.innerHTML = isVideo ? 
                    `<video src="${src}" controls autoplay style="max-width:90%"></video>` : 
                    `<img src="${src}" style="max-width:90%">`;
                lb.classList.add('active');
            }

            function closeLightbox() {
                document.getElementById('lightbox').classList.remove('active');
            }

            // 3. INITIALIZATION
document.addEventListener("DOMContentLoaded", async () => {
    const lang = localStorage.getItem('preferredLang') || 'en';
    
    // 1. Wait a tiny bit for components.js to inject the footer
    setTimeout(() => {
        if (window.updatePageText) updatePageText(lang);
    }, 100); 

    loadAboutGallery();
});

        </script>
    </body>
</html>
